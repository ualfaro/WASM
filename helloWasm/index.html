<html>
  <body>
    <script>
      function simpl(n){
        let i, t, a=0, b=1;
        for (i=0;i<n;i++){
          t=a+b; a=b; b=t;
        }
        return b;
      }
      function timer(fn, input, name){
        console.time(name);
        fn(input);
        console.timeEnd(name);
      }
      fetch('fib.wasm').then( response=>
          response.arrayBuffer()
      ).then(bytes =>
          WebAssembly.instantiate(bytes, {imports: {}})
        ).then(results=>
        {
          window.fib = results.instance.exports.fib;
        }
        );
    </script>
  </body>
</html>
